name: Browser and reader focus probe
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/event-probe/**'
      - 'tests/Superb.WindowsTests/**'
      - 'src/Superb.Desktop/ReaderWindow.xaml*'
      - 'src/Superb.Desktop/Platform/Protection.cs'
      - 'src/Superb.Desktop/Platform/HotkeyManager.cs'
      - 'src/Superb.Desktop/Platform/ExclusiveReaderHotkeys.cs'
      - 'src/Superb.Desktop/Platform/Native.cs'
      - 'src/Superb.Desktop/Configuration.cs'
      - 'src/Superb.Desktop/ScenarioSettings.cs'
      - 'src/Superb.Core/**'
      - 'src/Superb.Desktop/App.xaml*'
      - '.github/workflows/focus-probe.yml'
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [msedge, chrome]
        keys: [legacy, exclusive]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build Superb.slnx -c Release
      - name: Verify probe evidence and settled fixture commands
        run: python -m unittest discover -s tools/event-probe -p "test_*.py" -v
      - run: python -m pip install playwright==1.64.0
      - name: Measure headed browser with native Windows input
        run: python tools/event-probe/run_probe.py --browser ${{ matrix.browser }} --reader-keys ${{ matrix.keys }} --repeats 3 --output artifacts/event-probe/${{ matrix.browser }}-${{ matrix.keys }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-probe-${{ matrix.browser }}-${{ matrix.keys }}
          path: artifacts/event-probe/${{ matrix.browser }}-${{ matrix.keys }}/
